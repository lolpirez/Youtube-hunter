<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Hunter</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="card">
    <header class="top">
      <img class="logo" src="icons/icon48.png" alt="" width="28" height="28">
      <div class="brand">
        <strong>YouTube Hunter</strong>
        <span class="ver" id="ver"></span>
      </div>
    </header>

    <section class="row">
      <div class="copy">
        <span class="label">Open any YouTube video</span>
        <span class="sub">Press the Hunter button under the player to download it or cut a clip. The desktop app does the work.</span>
      </div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
